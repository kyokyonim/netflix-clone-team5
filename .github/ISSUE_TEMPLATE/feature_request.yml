name: Feature request
description: 기능 요청 템플릿
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 기능이 필요한 이유를 작성해주세요.
      placeholder: 예) 사용자 탐색 경험 개선
    validations:
      required: true

  - type: textarea
    id: requirement
    attributes:
      label: 요구사항
      description: 구현해야 할 항목을 적어주세요.
      placeholder: |
        - [ ] 카드 hover 시 상세 정보 노출
        - [ ] 모바일 터치 동작 대응
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 디자인 시안/링크/레퍼런스가 있으면 첨부해주세요.

  - type: input
    id: due
    attributes:
      label: 희망 완료일
      placeholder: YYYY-MM-DD
