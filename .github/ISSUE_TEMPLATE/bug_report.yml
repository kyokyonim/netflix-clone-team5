name: Bug report
description: 버그 제보 템플릿
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 어떤 문제가 발생했는지 간단히 작성해주세요.
      placeholder: 예) 배너가 로드되지 않습니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 재현 순서를 작성해주세요.
      placeholder: |
        1. 페이지 접속
        2. 버튼 클릭
        3. 에러 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      placeholder: 예) 영화 목록이 정상 표시되어야 합니다.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      placeholder: 예) 빈 화면만 표시됩니다.
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: 작업 브랜치
      placeholder: feat/name-feature
